spring.datasource.url=jdbc:mysql://localhost:3306/items_casse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

product-service.url=http://localhost:8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


management.endpoints.web.exposure.include=health,info,prometheus,metrics, requests

management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true